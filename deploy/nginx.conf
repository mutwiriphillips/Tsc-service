# TLS in front of the app (API and web pages on one port).
# Put the certificate and key in deploy/certs/ (fullchain.pem, privkey.pem).

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # The content security policy and other headers are set by the app itself.

  client_max_body_size 21m;   # 10 MB documents, 20 MB CSV imports

  # The app serves both the API (/api) and the web pages on one port.
  location / {
    proxy_pass http://app:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
  }
}
